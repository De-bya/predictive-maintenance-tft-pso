global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "predictive-maintenance-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "predictive-maintenance-custom"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics/custom"
    scrape_interval: 10s