version: "3.9"

services:
  api:
    build: .
    container_name: predictive-maintenance-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # mount data so model checkpoint is available
      - ./mlruns:/app/mlruns      # mount MLflow runs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /mlflow
    volumes:
      - ./mlruns:/mlflow/mlruns
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow --quiet &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri /mlflow/mlruns"
    restart: unless-stopped