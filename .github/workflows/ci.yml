name: CI — Test & Validate Pipeline

on:
  push:
    branches: [main, develop, paper-implementation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocessing tests (Eq. 1-2)
        run: |
          python -c "
          import numpy as np, pandas as pd
          from preprocessing.preprocess import interpolate_missing, zscore_normalize
          df = pd.DataFrame(np.random.randn(100, 68))
          df.iloc[5, 3] = np.nan
          df = interpolate_missing(df)
          df, scaler = zscore_normalize(df)
          assert df.shape == (100, 68) and not df.isnull().any().any()
          print('✅ Preprocessing tests passed')
          "

      - name: TFT model tests (Eq. 3, 5)
        run: |
          python -c "
          import torch
          from model.tft import TemporalFusionTransformer
          model = TemporalFusionTransformer(input_dim=68, hidden_dim=128,
                                            num_heads=4, num_layers=2)
          out = model(torch.randn(4, 60, 68))
          assert out.shape == (4, 2), f'Expected (4,2) got {out.shape}'
          print('✅ TFT model tests passed')
          "

      - name: PSO particle decoding test (Eq. 4)
        run: |
          python -c "
          from model.pso import PSO, decode_particle
          pso = PSO()
          lr, layers, heads = decode_particle(pso.bounds['high'])
          assert layers == 3 and heads == 8 and 128 % heads == 0
          print('✅ PSO tests passed')
          "

      - name: CUSUM drift detection tests (Eq. 6)
        run: |
          python -c "
          import numpy as np
          from mlops.drift import cusum_detect
          pts, _ = cusum_detect(np.ones(50), np.zeros(50))
          assert len(pts) > 0, 'CUSUM should flag a constant shift'
          pts, _ = cusum_detect(np.ones(50), np.ones(50))
          assert len(pts) == 0, 'CUSUM should not flag perfect predictions'
          print('✅ CUSUM tests passed')
          "

      - name: Exponential backoff tests (Eq. 7)
        run: |
          python -c "
          from resilience.backoff import with_exponential_backoff
          calls = []
          def flaky():
              calls.append(1)
              if len(calls) < 3: raise IOError('transient')
              return 42
          assert with_exponential_backoff(flaky, initial_delay=0.01) == 42
          assert len(calls) == 3
          print('✅ Backoff tests passed')
          "

      - name: API import test
        run: python -c "import api; print('✅ API import test passed')"

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t predictive-maintenance:latest .
