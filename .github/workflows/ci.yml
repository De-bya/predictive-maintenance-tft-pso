name: CI — Test & Validate Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing tests
        run: |
          python -c "
          import numpy as np
          from preprocessing.preprocess import interpolate_missing, zscore_normalize
          import pandas as pd
          df = pd.DataFrame(np.random.randn(100, 68))
          df = interpolate_missing(df)
          df, scaler = zscore_normalize(df)
          assert df.shape == (100, 68), 'Preprocessing shape mismatch'
          print('✅ Preprocessing tests passed')
          "

      - name: Run model architecture tests
        run: |
          python -c "
          import torch
          from model.tft import TemporalFusionTransformer
          model = TemporalFusionTransformer(
              input_dim=68, hidden_dim=128,
              num_heads=8, dropout=0.1, num_classes=2
          )
          x = torch.randn(4, 60, 68)
          out = model(x)
          assert out.shape == (4, 2), f'Expected (4,2) got {out.shape}'
          print('✅ TFT model tests passed')
          "

      - name: Run drift detection tests
        run: |
          python -c "
          from mlops.drift import cusum_detect, needs_retraining
          import numpy as np
          y_actual = np.random.rand(100)
          y_pred   = np.random.rand(100)
          pts = cusum_detect(y_actual, y_pred)
          print(f'✅ CUSUM drift test passed — {len(pts)} drift points')
          "

      - name: Run resilience tests
        run: |
          python -c "
          from resilience.backoff import with_exponential_backoff
          result = with_exponential_backoff(lambda: 42, initial_delay=0.01)
          assert result == 42
          print('✅ Backoff test passed')
          "

      - name: Run API import test
        run: |
          python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('api', 'api.py')
          print('✅ API import test passed')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t predictive-maintenance:latest .

      - name: Verify image builds
        run: |
          docker images predictive-maintenance
          echo "✅ Docker build successful"
          
  k8s-validate:
      runs-on: ubuntu-latest
      needs: test
      steps:
        - uses: actions/checkout@v4

        - name: Install kubeconform
          run: |
            curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
            tar xzf kubeconform.tar.gz
            sudo mv kubeconform /usr/local/bin/

        - name: Validate k8s manifests
          run: |
            kubeconform -summary -strict k8s/namespace.yaml k8s/configmap.yaml k8s/deployment.yaml k8s/service.yaml
            echo "✅ All k8s manifests valid"