apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance-service
  namespace: predictive-maintenance
  labels:
    app: predictive-maintenance-api
spec:
  type: NodePort
  selector:
    app: predictive-maintenance-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080     # access via minikube_ip:30080
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance-service-internal
  namespace: predictive-maintenance
spec:
  type: ClusterIP
  selector:
    app: predictive-maintenance-api
  ports:
    - port: 8000
      targetPort: 8000