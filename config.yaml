data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  window_size: 60
  test_split: 0.2

model:
  hidden_size: 128
  attention_heads: 4
  dropout: 0.1
  max_epochs: 50
  batch_size: 64
  learning_rate: 0.001

pso:
  n_particles: 10
  iterations: 20
  options:
    c1: 1.5
    c2: 1.5
    w: 0.7

drift:
  delta: 0.5
  threshold: 5.0

resilience:
  initial_delay: 1.0
  max_retries: 5

mlflow:
  experiment_name: "predictive_maintenance_tft_pso"
  tracking_uri: "mlruns"